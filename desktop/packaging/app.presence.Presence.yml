app-id: app.presence.Presence
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: presence
appstream-compose: false
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
modules:
  - name: presence
    buildsystem: simple
    build-commands:
      - mkdir -p /app/presence /app/bin
      - cp -a Presence/. /app/presence/
      - printf '#!/bin/sh\nexec /app/presence/bin/Presence "$@"\n' > /app/bin/presence
      - chmod +x /app/bin/presence /app/presence/bin/Presence
      - install -Dm644 app.presence.Presence.desktop /app/share/applications/app.presence.Presence.desktop
      - install -Dm644 app.presence.Presence.metainfo.xml /app/share/metainfo/app.presence.Presence.metainfo.xml
      - install -Dm644 presence-128.png /app/share/icons/hicolor/128x128/apps/app.presence.Presence.png
      - install -Dm644 presence-64.png /app/share/icons/hicolor/64x64/apps/app.presence.Presence.png
      - appstreamcli compose --components=app.presence.Presence --prefix=/ --origin=app.presence.Presence --result-root=/app --data-dir=/app/share/app-info/xmls /app
    sources:
      - type: dir
        path: ../build/compose/binaries/main/app
      - type: file
        path: app.presence.Presence.desktop
      - type: file
        path: app.presence.Presence.metainfo.xml
      - type: file
        path: ../build/generated/desktopIcons/presence-128.png
      - type: file
        path: ../build/generated/desktopIcons/presence-64.png
